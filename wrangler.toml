name = "frontblock-web"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]   # нужно для bcryptjs/некоторых API на edge

# Next.js билд лежит в .vercel/output/static (next-on-pages) — Pages сам подхватит
# при деплое через `wrangler pages deploy` или CI.

[[d1_databases]]
binding = "DB"
database_name = "frontblock-db"
database_id = "СЮДА_ID_ПОСЛЕ_СОЗДАНИЯ_D1"   # wrangler d1 create frontblock-db

[vars]
JWT_SECRET = "СМЕНИ_НА_СЛУЧАЙНУЮ_СТРОКУ_МИН_32_СИМВОЛА"
API_KEY    = "ТОТ_ЖЕ_КЛЮЧ_ЧТО_В_config.yml_ПЛАГИНА"   # X-Api-Key

# Pages Functions автоматически видят [vars] и [[d1_databases]] через context.env
